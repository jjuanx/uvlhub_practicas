# ----------------------------------------------------------------------------
# Deploy to Render (Práctica 1 - EGC)
#   Base: docs.uvlhub.io/tutorials/render_tutorial
#   Extensiones:
#     1. Solo se despliega si un pull request a main ha sido APROBADO y MERGEADO
#     2. Solo se despliega si TODAS las pruebas pasan (job deploy needs: tests)
#     3. También se despliega cuando se crea un TAG (v*) en GitHub
#
#   Nota: un push directo a main ya NO despliega; solo PR mergeado o tag.
# ----------------------------------------------------------------------------
name: Deploy to Render

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pull-requests: read

jobs:
  # --- Extensión 1: ¿PR mergeado y aprobado? (o ¿es un tag?) ---------------
  gate:
    name: Comprobar PR aprobado y mergeado / tag
    runs-on: ubuntu-24.04
    # Si es un PR cerrado SIN merge, ni siquiera arranca
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    steps:
      - name: Tag detectado
        if: github.event_name == 'push'
        run: echo "Despliegue por tag ${GITHUB_REF_NAME}"

      - name: Verificar que el PR tiene al menos una aprobación
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          approvals=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.state == "APPROVED")] | length')
          echo "Aprobaciones del PR #${PR_NUMBER}: ${approvals}"
          if [ "${approvals}" -lt 1 ]; then
            echo "::error::El PR #${PR_NUMBER} se mergeó sin aprobación. No se despliega."
            exit 1
          fi

  # --- Extensión 2: las pruebas deben pasar ---------------------------------
  tests:
    name: Tests
    needs: gate
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:12.0.2
        env:
          MARIADB_ROOT_PASSWORD: uvlhub_root_password
          MARIADB_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./rosemary

      - name: Run tests
        run: pytest app/features/ --ignore-glob='*selenium*'
        env:
          FLASK_ENV: testing
          MARIADB_HOSTNAME: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_TEST_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password

  # --- Despliegue: solo si gate y tests han ido bien -----------------------
  deploy:
    name: Deploy to Render
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Render deploy hook
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail -sS "$deploy_url"
