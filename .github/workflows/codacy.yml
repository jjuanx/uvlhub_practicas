# ----------------------------------------------------------------------------
# Codacy CI (Práctica 1 - EGC)
#   Base: docs.uvlhub.io/tutorials/codacy_tutorial
#   Extensiones:
#     1. Comprobar si hay versiones nuevas de las dependencias (pip list --outdated)
#     2. Probar compatibilidad con Python 3.13 y 3.14 (matriz)
#     3. Análisis de seguridad de dependencias con pip-audit
# ----------------------------------------------------------------------------
name: Codacy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- Extensiones 1 y 3: estado y seguridad de las dependencias -------------
  dependencies:
    name: Dependencias (outdated + pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # (1) Informa de las dependencias con versión nueva disponible.
      #     No rompe el build: solo deja el listado en el resumen del job.
      - name: Check for outdated dependencies
        run: |
          pip list --outdated --format=columns | tee outdated.txt
          {
            echo "## Dependencias desactualizadas"
            echo '```'
            cat outdated.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # (3) Audita requirements.txt contra la base de datos de vulnerabilidades
      #     (PyPI Advisory / OSV). Si encuentra alguna, el job falla.
      - name: Security audit with pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc

  # --- Tests + cobertura, extensión 2: matriz de versiones de Python --------
  codacy:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false            # que un fallo en 3.14 no cancele 3.13
      matrix:
        python-version: ['3.13', '3.14']

    services:
      mariadb:
        image: mariadb:12.0.2
        env:
          MARIADB_ROOT_PASSWORD: uvlhub_root_password
          MARIADB_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./rosemary

      - name: Run tests with coverage
        run: |
          coverage run -m pytest app/features/ --ignore-glob='*selenium*'
          coverage xml
        env:
          FLASK_ENV: testing
          MARIADB_HOSTNAME: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_TEST_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password

      # Solo se sube la cobertura una vez (la versión "oficial", 3.13)
      - name: Upload coverage to Codacy
        if: matrix.python-version == '3.13'
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
